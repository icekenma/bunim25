var lk=document.getElementById('lk'),dots=document.getElementById('dots'),msg=document.getElementById('msg'),cur='';
function paint(){[].forEach.call(dots.children,function(d,i){d.className=i<cur.length?'on':''})}
function fail(){cur='';paint();lk.classList.remove('busy');msg.className='msg err';msg.textContent='비밀번호가 맞지 않습니다';dots.classList.remove('bad');void dots.offsetWidth;dots.classList.add('bad')}
function press(v){if(lk.classList.contains('busy'))return;if(v==='x'){cur=cur.slice(0,-1);paint();return}if(cur.length>=4)return;cur+=v;paint();
  if(cur.length===4){lk.classList.add('busy');msg.className='msg';msg.textContent='여는 중…';open(cur).catch(fail)}}
document.getElementById('pad').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;press(b.classList.contains('x')?'x':b.textContent)});
document.addEventListener('keydown',function(e){if(lk.hidden)return;if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('x')});
var saved=null;try{saved=localStorage.getItem('b25pw')}catch(e){}
if(!window.crypto||!crypto.subtle){lk.hidden=false;msg.className='msg err';msg.textContent='이 브라우저에서는 열 수 없습니다. Safari 또는 Chrome으로 여세요.'}
else if(saved){open(saved).catch(function(){try{localStorage.removeItem('b25pw')}catch(e){}lk.hidden=false})}
else lk.hidden=false;
</script></body></html>
